plugins {
    id 'com.android.application'
}

android {
    namespace 'com.imove.android'
    compileSdk 36

    signingConfigs {
        debug {
            def localKey = file('../.signing/debug.keystore')
            if (localKey.exists()) {
                storeFile localKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'com.imove.android'
        minSdk 30
        targetSdk 36
        versionCode 10
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
