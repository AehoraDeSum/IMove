<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2117">
  <title>IMove · Map</title>
  <link rel="stylesheet" href="/leaflet.css">
  <style>
    html,body,#map { width:100%; height:100%; margin:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#0b2117; }
    body.dark-map .leaflet-tile-pane { filter: grayscale(.95) invert(1) hue-rotate(180deg) brightness(.84) contrast(.9); }
    .hint { position:absolute; z-index:1000; top:12px; left:50%; transform:translateX(-50%);
      max-width:calc(100% - 150px); padding:9px 13px; border-radius:10px; background:#0b2117f0;
      color:white; font-size:12px; text-align:center; pointer-events:none; box-shadow:0 5px 20px #0b211735; }
    .style-toggle { position:absolute; z-index:1000; top:12px; right:12px; background:#0b2117ed;
      border:1px solid #487051; border-radius:10px; color:#d9ffe2; padding:8px 11px;
      font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .leaflet-control-attribution { font-size:10px !important; background:#0b2117d8 !important; color:#effff3; }
    .leaflet-control-attribution a { color:#8ff7af !important; }
    .leaflet-control-zoom a { background:#13291e !important; color:#effff3 !important; border-color:#2a4b36 !important; }
    .leaflet-control-scale-line { background:#0b2117d8 !important; color:#effff3 !important; border-color:#effff3 !important; }
  </style>
</head>
<body class="dark-map">
  <div id="map" aria-label="Location picker map"></div>
  <div id="hint" class="hint">Tap the map to choose a point</div>
  <button id="styleToggle" class="style-toggle" type="button">Light map</button>
  <script src="/leaflet.js"></script>
  <script src="/map.js"></script>
</body>
</html>
